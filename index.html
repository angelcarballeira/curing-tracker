<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Curado</title>

  <meta name="theme-color" content="#059669" />
  <!-- iOS ignores the manifest icons and needs its own tag -->
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <!-- Replace the old vite.svg favicon line with these two: -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />

  <script>
    // Runs before the page paints, to avoid a white flash in dark mode.
    // Same logic as getInitialTheme(), but it must be plain JS here.
    (function () {
      var saved = localStorage.getItem('theme')
      var dark = saved
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
